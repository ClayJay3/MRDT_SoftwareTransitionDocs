server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This image holds one directory, /signal-studio, and the build inside it
    # addresses itself under that same prefix. So the files land where the URLs
    # already point and nothing has to be rewritten. Anything outside the prefix
    # is missing from the image rather than forbidden by a rule, which is the
    # property worth having: there is no docs content here to get the rule wrong
    # about.
    location / {
        try_files $uri $uri/ $uri.html /signal-studio/404.html;
    }

    # Long-cache the fingerprinted assets, never cache HTML.
    location /signal-studio/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
